# PR と main への push で、静的解析とテストを実行する
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同じブランチに続けて push したときは、古い実行を取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # pubspec.lock を作った手元の Flutter と同じ版に固定する。
          # 版が違うと SDK 同梱のパッケージが食い違い、--enforce-lockfile で失敗する
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        # pubspec.lock と食い違う依存関係があれば失敗させる
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
